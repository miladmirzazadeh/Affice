<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Trella — a local-first task board shared by you and your agents."
    />
    <link rel="icon" href="/trella.svg" type="image/svg+xml" />
    <title>Trella</title>
    <script>
      // Set the appearance before first paint so the board never flashes the
      // wrong surface colour.
      (() => {
        const stored = localStorage.getItem('trella:appearance');
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
